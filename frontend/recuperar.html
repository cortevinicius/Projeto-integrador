<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recuperar Senha</title>

<link rel="stylesheet" href="/css/recuperar.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="box">

        <div class="logo">
            <h2>SENAI-CIC</h2>
            <span>INDUSTRIAL INTELLIGENCE</span>
        </div>

        <div class="icone">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>Esqueceu sua senha?</h1>

        <p>
            Não se preocupe! Digite seu e-mail institucional
            e enviaremos instruções para redefinir sua senha.
        </p>

        <form>

            <label>E-mail Institucional</label>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                type="email"
                placeholder="aluno@senai.br">
            </div>

            <button type="button" onclick="recuperarSenha()">
                Enviar Instruções
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <div id="mensagem" class="mensagem">
            ✓ Instruções para recuperação de senha enviadas com sucesso!
        </div>

        <a href="inicio.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar para o Login
        </a>

    </div>

</div>

<script>

function recuperarSenha(){

    const email =
    document.querySelector('input[type="email"]').value;

    if(email.trim() === ""){

        alert("Por favor, informe seu e-mail institucional.");
        return;
    }

    document.getElementById("mensagem").style.display = "block";

    setTimeout(() => {
       window.location.href = "inicio.html";
    }, 3000);

}

</script>

</body>
</html>
